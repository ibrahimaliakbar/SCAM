<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Georgia', serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #7a1c3a;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .buttons {
      position: relative;
      margin-top: 20px;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      margin: 10px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #fff;
      color: #ff4d6d;
      position: absolute;
    }

    /* Floating photos */
    .photos {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .photos img {
      position: absolute;
      width: 120px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      animation: float 6s ease-in-out infinite;
    }

    .photos img:nth-child(even) {
      animation-duration: 8s;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-25px); }
      100% { transform: translateY(0px); }
    }

    /* YAY page */
    #yayPage {
      display: none;
    }

    #yayPage h1 {
      font-size: 4rem;
      color: #ff2f6e;
    }

    .subtitle {
      font-size: 1.3rem;
      color: #7a1c3a;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- FRONT PAGE -->
<div class="page" id="mainPage">
  <h1>Will you be my Valentine? 🌹</h1>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>

  <div class="photos">
    <img src="photo1.jpg" style="top:5%; left:8%;">
    <img src="photo2.jpg" style="top:15%; right:10%;">
    <img src="photo3.jpg" style="bottom:10%; left:12%;">
    <img src="photo4.jpg" style="bottom:18%; right:14%;">
    <img src="photo5.jpg" style="top:35%; left:3%;">
    <img src="photo6.jpg" style="top:40%; right:4%;">
    <img src="photo7.jpg" style="bottom:35%; left:6%;">
    <img src="photo8.jpg" style="bottom:40%; right:6%;">
  </div>
</div>

<!-- YAY PAGE -->
<div class="page" id="yayPage">
  <h1>YAYYY 💕🎉</h1>
  <div class="subtitle">I knew it would always be you.</div>

  <div class="photos">
    <img src="photo9.jpg" style="top:20%; left:25%;">
    <img src="photo10.jpg" style="top:20%; right:25%;">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  yesBtn.addEventListener("click", () => {
    document.getElementById("mainPage").style.display = "none";
    document.getElementById("yayPage").style.display = "flex";

    confetti({
      particleCount: 180,
      spread: 80,
      origin: { y: 0.6 }
    });
  });
</script>

</body>
</html>
