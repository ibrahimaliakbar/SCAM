<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(180deg, #ffd6e8, #fff0f5);
  overflow-x: hidden;
}

/* Floating animation */
@keyframes float {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-15px); }
  100% { transform: translateY(0); }
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  animation: floatUp 9s linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-120vh); }
}

/* Card */
.card {
  max-width: 950px;
  margin: 60px auto;
  background: rgba(255,255,255,0.9);
  border-radius: 32px;
  padding: 40px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.15);
  position: relative;
  z-index: 2;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 46px;
  color: #b30059;
  margin-bottom: 30px;
}

/* Floating gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  margin-bottom: 35px;
}

.gallery img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 22px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.18);
  animation: float 5s ease-in-out infinite;
}

.gallery img:nth-child(even) {
  animation-duration: 6s;
}

/* Buttons */
.buttons {
  position: relative;
  height: 120px;
}

button {
  padding: 16px 36px;
  font-size: 20px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  font-weight: 500;
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
  color: white;
  box-shadow: 0 12px 30px rgba(255,77,109,0.45);
}

#no {
  background: #999;
  color: white;
  position: absolute;
}

/* Confetti canvas */
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">
  <h1>WILL YOU BE MY VALENTINE? 💐</h1>

  <div class="gallery">
    <img src="photo1.jpeg">
    <img src="photo2.jpeg">
    <img src="photo3.jpeg">
    <img src="photo4.jpeg">
    <img src="photo5.jpeg">
    <img src="photo6.jpeg">
    <img src="photo7.jpeg">
    <img src="photo8.jpeg">
  </div>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no">No</button>
  </div>
</div>

<script>
/* Floating hearts */
const hearts = ["💖","🌸","💐","🌹","💕"];
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerText = hearts[Math.floor(Math.random()*hearts.length)];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = Math.random() * 20 + 18 + "px";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 9000);
}, 500);

/* No button escape */
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", () => {
  noBtn.style.left = Math.random() * 320 + "px";
  noBtn.style.top = Math.random() * 90 + "px";
});

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function confettiBurst() {
  const pieces = [];
  const colors = ["#ff4d6d","#ffd166","#06d6a0","#f72585","#ff8fa3"];

  for (let i = 0; i < 260; i++) {
    pieces.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.7) * 10,
      gravity: 0.35
    });
  }

  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    requestAnimationFrame(animate);
  }
  animate();
}

/* YES CLICK → YAYYY PAGE */
function yesClicked() {
  confettiBurst();
  setTimeout(() => {
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        background:linear-gradient(135deg,#ff4d6d,#ff8fa3);
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:35px;
        color:white;
        font-family:'Playfair Display',serif;
        text-align:center;
        padding:40px;
      ">
        <div style="font-size:76px; font-weight:bold;">
          YAYYY 💖
        </div>

        <div style="
          display:flex;
          gap:30px;
          flex-wrap:wrap;
          justify-content:center;
        ">
          <img src="photo9.jpg" style="
            width:280px;
            height:380px;
            object-fit:cover;
            border-radius:26px;
            box-shadow:0 18px 35px rgba(0,0,0,0.35);
            animation: float 5s ease-in-out infinite;
          ">

          <img src="photo10.jpg" style="
            width:280px;
            height:380px;
            object-fit:cover;
            border-radius:26px;
            box-shadow:0 18px 35px rgba(0,0,0,0.35);
            animation: float 6s ease-in-out infinite;
          ">
        </div>
      </div>
    `;
  }, 1200);
}
</script>

</body>
</html>
