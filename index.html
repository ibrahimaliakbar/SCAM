<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(180deg, #ffe4ec, #fff7f9);
  overflow-x: hidden;
}

/* Floating animation */
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
  100% { transform: translateY(0); }
}

/* Floating hearts & flowers */
.heart {
  position: fixed;
  bottom: -20px;
  animation: rise 10s linear infinite;
  opacity: 0.5;
}

@keyframes rise {
  from { transform: translateY(0); }
  to { transform: translateY(-120vh); }
}

/* Card */
.card {
  max-width: 960px;
  margin: 60px auto;
  background: rgba(255,255,255,0.92);
  border-radius: 36px;
  padding: 42px;
  text-align: center;
  box-shadow: 0 30px 70px rgba(0,0,0,0.14);
  position: relative;
  z-index: 2;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 46px;
  color: #a8004f;
  margin-bottom: 28px;
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 18px;
  margin-bottom: 36px;
}

.gallery img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 22px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.18);
  animation: float 5s ease-in-out infinite;
}

.gallery img:nth-child(even) {
  animation-duration: 6.5s;
}

/* Buttons */
.buttons {
  position: relative;
  height: 120px;
}

button {
  padding: 16px 38px;
  font-size: 20px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  font-weight: 500;
}

#yes {
  background: linear-gradient(135deg, #ff5c8a, #ff9bb5);
  color: white;
  box-shadow: 0 14px 30px rgba(255,92,138,0.45);
}

#no {
  background: #aaa;
  color: white;
  position: absolute;
}

/* Confetti */
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="card">
  <h1>WILL YOU BE MY VALENTINE? 💐</h1>

  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
  </div>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no">No</button>
  </div>
</div>

<script>
/* Floating emojis */
const emojis = ["💖","🌸","💐","🌹","💕"];
setInterval(() => {
  const e = document.createElement("div");
  e.className = "heart";
  e.innerText = emojis[Math.floor(Math.random()*emojis.length)];
  e.style.left = Math.random() * 100 + "vw";
  e.style.fontSize = Math.random() * 22 + 16 + "px";
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 10000);
}, 600);

/* No button escape */
const noBtn = document.getElementById("no");
noBtn.addEventListener("mouseover", () => {
  noBtn.style.left = Math.random() * 320 + "px";
  noBtn.style.top = Math.random() * 90 + "px";
});

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function confettiBurst() {
  const pieces = [];
  const colors = ["#ff5c8a","#ffd1dc","#ffb3c6","#f72585","#ffc8dd"];

  for (let i = 0; i < 260; i++) {
    pieces.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: Math.random() * 6 + 4,
      color: colors[Math.floor(Math.random()*colors.length)],
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.7) * 10,
      gravity: 0.35
    });
  }

  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    requestAnimationFrame(animate);
  }
  animate();
}

/* YES → YAYYY PAGE */
function yesClicked() {
  confettiBurst();
  setTimeout(() => {
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        background:linear-gradient(135deg,#ff5c8a,#ff9bb5);
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:28px;
        color:white;
        font-family:'Playfair Display',serif;
        text-align:center;
        padding:40px;
      ">
        <div style="font-size:78px; font-weight:bold;">
          YAYYY 💖
        </div>

        <div style="
          font-size:22px;
          font-family:'Poppins',sans-serif;
          opacity:0.95;
        ">
          I knew it would always be you.
        </div>

        <div style="
          display:flex;
          gap:30px;
          flex-wrap:wrap;
          justify-content:center;
        ">
          <img src="photo9.jpg" style="
            width:280px;
            height:380px;
            object-fit:cover;
            border-radius:28px;
            box-shadow:0 18px 40px rgba(0,0,0,0.35);
            animation: float 5s ease-in-out infinite;
          ">

          <img src="photo10.jpg" style="
            width:280px;
            height:380px;
            object-fit:cover;
            border-radius:28px;
            box-shadow:0 18px 40px rgba(0,0,0,0.35);
            animation: float 6.5s ease-in-out infinite;
          ">
        </div>

        <div style="
          font-size:12px;
          opacity:0.35;
          margin-top:10px;
        ">
          always & quietly.
        </div>
      </div>
    `;
  }, 1200);
}
</script>

</body>
</html>
